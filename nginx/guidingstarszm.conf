# Nginx configuration for guidingstarszm.com
# Location on server: /etc/nginx/sites-available/guidingstarszm
# Enable with: sudo ln -s /etc/nginx/sites-available/guidingstarszm /etc/nginx/sites-enabled/

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name guidingstarszm.com www.guidingstarszm.com;

    # Let Certbot handle ACME challenges for SSL renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.guidingstarszm.com$request_uri;
    }
}

# ── Redirect non-www HTTPS → www ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guidingstarszm.com;

    ssl_certificate     /etc/letsencrypt/live/guidingstarszm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guidingstarszm.com/privkey.pem;

    return 301 https://www.guidingstarszm.com$request_uri;
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.guidingstarszm.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/guidingstarszm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guidingstarszm.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/guidingstarszm-access.log;
    error_log  /var/log/nginx/guidingstarszm-error.log;

    # ── Upload size limit (increase if you expect larger file uploads) ────────
    client_max_body_size 20M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-Frame-Options          "SAMEORIGIN"        always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # ── Proxy all traffic to Express (port 5000) ──────────────────────────────
    # Express serves the React SPA, /uploads, all API routes, and SEO files.
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts (increase if API calls are slow)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
